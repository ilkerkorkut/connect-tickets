name: github-tracker-test

x-test-environment: &test-environment
  APP_ENV: test
  LOG_FORMAT: json
  DATABASE_URL: postgres://tracker:tracker@postgres:5432/tracker_test?sslmode=disable
  TEST_DATABASE_URL: postgres://tracker:tracker@postgres:5432/tracker_test?sslmode=disable
  REDIS_ADDR: redis:6379
  KAFKA_BROKERS: kafka:9092

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: tracker_test
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: tracker
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d tracker_test"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.1-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.8.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    tmpfs:
      - /tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  kafka-init:
    image: apache/kafka:3.8.1
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ./deploy/docker/kafka:/scripts:ro
    entrypoint: ["/bin/bash", "/scripts/create-topics.sh"]

  migrate:
    image: arigaio/atlas:0.36.2
    command: ["migrate", "apply", "--dir", "file:///migrations", "--revisions-schema", "atlas_schema_revisions", "--url", "postgres://tracker:tracker@postgres:5432/tracker_test?sslmode=disable&search_path=public"]
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy

  test-runner:
    build:
      context: .
      target: build
    working_dir: /src
    command: ["go", "test", "-count=1", "-race", "-tags", "integration", "./..."]
    environment: *test-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
